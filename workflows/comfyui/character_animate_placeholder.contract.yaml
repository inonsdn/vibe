# Placeholder CHARACTER ANIMATION workflow contract.
#
# PURPOSE
# -------
# This proves the *sequence* plumbing between the application and ComfyUI for
# the master creation path, without requiring a single model weight. It is a
# wiring test. Its output is not character animation and must never be judged
# as such.
#
# WHY THIS BINDS SEQUENCES, NOT STILLS
# ------------------------------------
# A chunk is 8-24 output frames. A workflow that receives one pose image for a
# whole chunk is not animating anything, and a backend that uploads one pose
# while the manifest records 24 is lying. So the contract binds:
#
#   pose_sequence     every pose in the chunk, in order, as one asset
#   context_sequence  every accepted context frame handed to this chunk, in order
#   batch_size        the number of frames the workflow must return
#
# The backend validates all three against the chunk before it submits anything.
#
# NODE TYPES
# ----------
# `LoadImagesFromDirectory` is NOT a core ComfyUI node; it comes from a
# directory-loading custom node pack (several exist). That is deliberate and
# honest: a real multi-frame workflow needs one, and `prepare()` will tell you
# plainly which node types your installation is missing rather than pretending.
# Install the pack yourself -- this application never downloads anything.
# `RepeatImageBatch`, `LoadImage`, `ImageScale`, `ImageBlend` and `SaveImage`
# are core.
#
# WHAT A REAL WORKFLOW MUST DO THAT THIS DOES NOT
# -----------------------------------------------
# 1. Actually animate the Hero Character into the supplied poses.
# 2. Condition on `context_sequence` so chunk boundaries are continuous rather
#    than merely adjacent. This placeholder loads it and throws it away, which
#    is why chunk continuity cannot be evaluated with this workflow.
# 3. Hold the background fixed across chunks.
# 4. Bind `seed`, `steps`, `denoise`, `guidance_scale`, `start_frame` and `fps`
#    where its sampler and temporal modules need them. All six are supported
#    logical inputs; this placeholder has no sampler, so it binds none of them.
#
# CONNECTING A REAL WORKFLOW
# --------------------------
# Same procedure as the garment workflow: build and test it by hand in ComfyUI,
# title every node the application must write into, export the API format, copy
# this file to <your_workflow_id>.contract.yaml, update the node titles, and set
# `animator.workflow_id` in config/app.yaml.
#
# See docs/comfyui-integration.md.

workflow_id: character_animate_placeholder
workflow_file: character_animate_placeholder.json
description: >-
  Wiring-test workflow for the character animation path. Blends a pose control
  sequence over a repeated character reference. No checkpoints, no model
  weights, and NOT a character animator.

requires_model_nodes: false

inputs:
  - logical_name: pose_sequence
    node_title: POSE_SEQUENCE
    input_name: directory
    kind: sequence_dir
    required: true
    description: >-
      Every pose in the chunk, rendered as skeleton control images in the
      canonical output size and named by ordinal position so a directory loader
      reads them in frame order. One asset per chunk; never a single still.

  - logical_name: frame_count
    node_title: POSE_SEQUENCE
    input_name: image_load_cap
    kind: value
    required: false
    description: >-
      How many frames of the pose sequence to load. Equals the chunk's frame
      count; a cap below it would silently animate a short chunk.

  - logical_name: context_sequence
    node_title: CONTEXT_SEQUENCE
    input_name: directory
    kind: sequence_dir
    required: false
    description: >-
      The already-accepted frames immediately preceding this chunk, in order.
      This is the continuity signal. Absent for the first chunk.

  - logical_name: hero_reference
    node_title: HERO_CHARACTER_REFERENCE
    input_name: image
    kind: image_upload
    required: true
    description: >-
      The Hero Character reference image. A real workflow may additionally bind
      hero_reference_back and hero_reference_side.

  - logical_name: batch_size
    node_title: HERO_BATCH
    input_name: amount
    kind: value
    required: true
    description: >-
      The number of frames this submission must return -- the chunk's frame
      count. The backend refuses to submit a contract that does not bind this,
      because otherwise the output count is the workflow's guess.

  - logical_name: width
    node_title: CANONICAL_OUTPUT_SIZE
    input_name: width
    kind: value
    required: true
    description: Canonical output width, fixed by the skeleton profile.

  - logical_name: height
    node_title: CANONICAL_OUTPUT_SIZE
    input_name: height
    kind: value
    required: true
    description: Canonical output height, fixed by the skeleton profile.

  - logical_name: output_prefix
    node_title: ANIMATED_FRAMES_OUT
    input_name: filename_prefix
    kind: value
    required: false
    description: Per-chunk output prefix so concurrent candidates cannot collide.

output_node_titles:
  - ANIMATED_FRAMES_OUT

notes:
  chunking: >-
    The backend submits one prompt per chunk and expects exactly `batch_size`
    frames back, in order. It validates before submitting that the staged pose
    sequence has exactly one entry per requested frame, that the context
    sequence matches the context frames the pipeline gathered, and after
    collecting that the returned frames are unique and in order.
  context: >-
    This contract declares `context_sequence`, so the backend may report
    ContextMode.SEQUENCE honestly. The placeholder graph loads the sequence and
    does not use it; a real workflow must feed it into a temporal module.
  vram: >-
    Core image nodes only; peak VRAM is negligible. A real character animation
    workflow on an 8GB card should use a chunk of 8-24 frames, 12-24 context
    frames, tiled VAE decode and low-VRAM mode. See
    docs/troubleshooting-8gb-vram.md.
  determinism: >-
    This placeholder contains no sampler and is therefore deterministic. A real
    workflow must be verified by animating the same chunk twice at the same seed
    and comparing frame hashes before determinism is claimed anywhere.
  not_an_animator: >-
    Do not evaluate character animation quality with this workflow. It exists to
    prove that a pose sequence arrives, that outputs come back one per frame,
    that chunk resume works and that manifests are complete.
