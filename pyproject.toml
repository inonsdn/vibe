[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "garment-replacer"
version = "0.1.0"
description = "Fully local, model-agnostic video garment replacement system (identity-preserving)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.7",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "typer>=0.12",
  "opencv-python-headless>=4.9",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10",
  "black>=24.0",
  "types-PyYAML",
]

[project.scripts]
app = "app.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
app = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "integration: end-to-end pipeline tests (still GPU-free and offline)",
  "requires_ffmpeg: needs ffmpeg/ffprobe on PATH",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PTH", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/app/cli/*" = ["B008", "UP007"]
"src/app/api/*" = ["B008"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["app"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_optional = true
strict_equality = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
